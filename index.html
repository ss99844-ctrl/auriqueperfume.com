<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AURIQUE | Leave Your Aura Behind</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      border-bottom: 1px solid #333;
    }

    .logo {
      color: #d4af37;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 6px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .hero h1 {
      font-size: 55px;
      letter-spacing: 5px;
      max-width: 900px;
    }

    .hero p {
      color: #bbbbbb;
      font-size: 18px;
      margin: 25px 0;
    }

    .btn {
      background: #d4af37;
      color: black;
      padding: 15px 30px;
      text-decoration: none;
      font-weight: bold;
    }

    .collection {
      padding: 80px 8%;
      text-align: center;
    }

    .collection h2 {
      color: #d4af37;
      letter-spacing: 3px;
      margin-bottom: 40px;
    }

    .products {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .product {
      background: #151515;
      width: 280px;
      padding: 30px;
      border: 1px solid #333;
    }

    .product h3 {
      color: #d4af37;
      margin-bottom: 15px;
    }

    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #333;
      color: #888;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 32px;
      }

      nav {
        display: none;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">AURIQUE</div>

    <nav>
      <a href="#">HOME</a>
      <a href="#shop">SHOP</a>
      <a href="#">ABOUT</a>
      <a href="#">CONTACT</a>
    </nav>
  </header>

  <section class="hero">
    <h1>LEAVE YOUR AURA BEHIND</h1>

    <p>Luxury fragrances designed to linger beyond presence.</p>

    <a href="#shop" class="btn">EXPLORE FRAGRANCES</a>
  </section>

  <section class="collection" id="shop">

    <h2>OUR COLLECTION</h2>

    <div class="products">

      <div class="product">
        <h3>FOR HIM</h3>
        <p>Fresh. Refined. Limitless.</p>
      </div>

      <div class="product">
        <h3>FOR HER</h3>
        <p>Elegant. Captivating. Timeless.</p>
      </div>

      <div class="product">
        <h3>UNISEX</h3>
        <p>Beyond boundaries.</p>
      </div>

    </div>

  </section>

  <footer>
    © 2026 AURIQUE — Leave Your Aura Behind
  </footer>

</body>
</html>
